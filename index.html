
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Burr Fast Food</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Splash Screen / Pop-up Logo -->
    <div id="splash-screen">
        <div class="splash-content">
            <img src="logo.png" alt="Al Burr Logo" class="pop-logo">
            <h1>Al Burr Fast Food</h1>
            <p>خوش آمدید! بہترین ذائقہ، آپ کے دروازے پر</p>
        </div>
    </div>

    <!-- Customer Details Form / Home Screen -->
    <div id="customer-screen" class="screen hidden">
        <div class="container">
            <img src="logo.png" alt="Logo" class="form-logo">
            <h2>Al Burr Fast Food</h2>
            <p class="tagline">براہ کرم اپنے آرڈر کے لیے تفصیلات درج کریں</p>
            
            <form id="customer-form">
                <div class="input-group">
                    <label><i class="fa fa-user"></i> کسٹمر کا نام</label>
                    <input type="text" id="cust-name" required placeholder="अपना نام لکھیں">
                </div>
                <div class="input-group">
                    <label><i class="fa fa-phone"></i> فون نمبر</label>
                    <input type="tel" id="cust-phone" required placeholder="03XXXXXXXXX">
                </div>
                <div class="input-group">
                    <label><i class="fa fa-map-marker-alt"></i> مکمل ایڈریس</label>
                    <textarea id="cust-address" required placeholder="گھر کا پتہ / گلی نمبر / علاقہ"></textarea>
                </div>
                <button type="submit" class="btn-primary">آرڈر مینو پر جائیں <i class="fa fa-arrow-left"></i></button>
            </form>
        </div>
    </div>

    <!-- Main Menu Screen -->
    <div id="menu-screen" class="screen hidden">
        <header>
            <div class="header-left">
                <img src="logo.png" alt="Logo" class="header-logo">
                <span>Al Burr Fast Food</span>
            </div>
            <button id="cart-btn" class="cart-icon-btn">
                <i class="fa fa-shopping-cart"></i>
                <span id="cart-count">0</span>
            </button>
        </header>

        <!-- Categories Navigation -->
        <div class="categories-bar">
            <button class="cat-chip active" onclick="filterMenu('all')">سب</button>
            <button class="cat-chip" onclick="filterMenu('pizza')">پیزا</button>
            <button class="cat-chip" onclick="filterMenu('burger')">برگر</button>
            <button class="cat-chip" onclick="filterMenu('rolls')">رولز</button>
            <button class="cat-chip" onclick="filterMenu('shawarma')">شاورما</button>
            <button class="cat-chip" onclick="filterMenu('pasta')">پاستا</button>
            <button class="cat-chip" onclick="filterMenu('fries')">فرائز & ونگز</button>
        </div>

        <!-- Menu Items Grid -->
        <div class="menu-container" id="menu-items-grid">
            <!-- Items will be dynamically loaded via script.js -->
        </div>
    </div>

    <!-- Cart Sidebar / Modal -->
    <div id="cart-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" id="close-cart">&times;</span>
            <h2>آپ کی کارٹ (Cart)</h2>
            <div id="cart-items-list">
                <!-- Cart items go here -->
            </div>
            <div class="cart-summary">
                <h3>کل رقم: <span id="cart-total">Rs. 0</span></h3>
                <button id="whatsapp-order-btn" class="btn-whatsapp">
                    <i class="fab fa-whatsapp"></i> واٹس ایپ پر آرڈر کریں
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
